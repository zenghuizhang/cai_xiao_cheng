plugins {
    id 'com.android.application'
}

android {
    namespace 'com.caixiaomiao.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.caixiaomiao.app"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Intentionally no external runtime dependencies:
    // pure framework Activity + WebView keeps the APK tiny and the build hermetic.
}
